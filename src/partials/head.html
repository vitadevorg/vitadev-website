<link rel="stylesheet" href="./assets/styles.css">
<script>
  /* Animaciones al desplazarse: la clase se pone antes de pintar para que el
     contenido no aparezca y desaparezca. Si app.js no llega a correr, a los
     3 s se quita y todo se ve igual. */
  if ('IntersectionObserver' in window) {
    document.documentElement.classList.add('js-reveal');
    setTimeout(function () {
      if (!document.documentElement.dataset.revealListo) document.documentElement.classList.remove('js-reveal');
    }, 3000);
  }
</script>
